micronaut:
  application:
    name: c-star-core-service
  server:
    port: 8081
  grpc:
    server:
      port: 9080
      health-status-enabled: true

datasources:
  default:
    url: jdbc:mariadb://localhost:3306/cstar_core?createDatabaseIfNotExist=true
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${DB_USER:cstar}
    password: ${DB_PASSWORD:cstar}
    maximum-pool-size: 10

flyway:
  datasources:
    default:
      enabled: true
      locations: classpath:db/migration
      baseline-on-migrate: true

data:
  jdbc:
    repositories:
      enabled: true

# C-Star business config (Phase 1: config-file driven)
cstar:
  category:
    active-ids: [1, 2, 3, 4, 5]  # Teamwork / Excellence / Innovation / Customer Focus / Going Above & Beyond
  quota:
    default: 10                   # default per-period quota (Red Flowers)
    period-length-days: 1         # ADR-0005: daily default
  timezone: Asia/Shanghai         # ADR-0005: UTC+8 for period boundary

# Phase 2: admin-service gRPC target (not deployed in Phase 1)
cstar-admin:
  grpc:
    host: localhost
    port: 9090

logger:
  levels:
    com.cstar: DEBUG
    io.micronaut.flyway: INFO
