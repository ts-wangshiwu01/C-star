micronaut:
  application:
    name: c-star-api-gateway
  server:
    port: 8080
    cors:
      enabled: true
      configurations:
        all:
          allowedOrigins:
            - http://localhost:5173
            - http://127.0.0.1:5173
          allowedMethods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          allowedHeaders:
            - Authorization
            - Content-Type
            - X-Requested-With
          exposedHeaders:
            - Content-Disposition
          allowCredentials: true
          maxAge: 3600
  grpc:
    client:
      plaintext: true
  security:
    # Dev: mock mode returns fake data and LoginController bypasses JWT, so the
    # security filter is disabled during front-end/gateway integration. Re-enable
    # before production.
    enabled: false
    authentication: bearer
    token:
      jwt:
        signatures:
          secret:
            generator:
              secret: ${JWT_SECRET:please-override-in-prod}
        enabled: true

# C-Star business config
cstar:
  mock:
    # Dev mock mode: the gateway returns in-memory mock data and the login flow
    # bypasses JWT verify + core-service gRPC. Set to false to use real flows.
    enabled: ${CSTAR_MOCK_ENABLED:true}
  sso:
    # Verification mode:
    #   mock — use the locally configured RSA key below (no network). Default for dev/test.
    #   aldp — fetch ALDP JWKS from jwks-url at runtime (production; not yet implemented).
    mode: ${CSTAR_SSO_MODE:mock}
    jwks-url: ${ALDP_JWKS_URL:https://sso.example.com/.well-known/jwks.json}
    issuer: ${ALDP_ISSUER:https://sso.example.com}
